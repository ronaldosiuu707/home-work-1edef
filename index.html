<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог пользователей</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #182b49;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        button {
            padding: 12px 20px;
            background: #2980b9;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #1c5980;
        }

        button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        #status {
            text-align: center;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .error {
            color: #d9534f;
        }

        .success {
            color: green;
        }

        .users-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
        }

        .user-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .user-card h3 {
            color: #182b49;
            margin-top: 0;
        }

        .user-card p {
            color: #555;
            font-size: 14px;
        }

        .valid {
            color: green;
        }

        .invalid {
            color: red;
        }
    </style>
</head>

<body>

    <h1>Каталог пользователей</h1>

    <div class="buttons">

        <button id="loadBtn">
            Загрузить через async/await
        </button>

        <button id="promiseBtn">
            Загрузить через Promise (.then)
        </button>

    </div>

    <p id="status"></p>

    <div id="usersContainer" class="users-list"></div>

    <script src="script.js"></script>

</body>
</html>
